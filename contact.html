<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/course.css" />
    <link rel="stylesheet" href="./css/contact.css" />

    <!-- Font awesome icon -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
      integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- header section -->
    <header>
      <div class="container flex">
        <a href="index.html" class="logo">Whitecliffe</a>
        <nav>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="course.html">Courses</a></li>
            <li><a href="Contact.html" style="color: #04aa6d">Contacts</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- contact section -->
    <section class="container contact">
      <h1>Contact Us</h1>
      <!-- top -contact detail -->
      <div class="contact-detail-container">
        <h4>Our Contact Details</h4>
        <div class="detail-box">
          <i class="fas fa-phone"></i>
          <span>+64-123-123456</span>
        </div>
        <div class="detail-box">
          <i class="fas fa-envelope"></i>
          <span>info@Whiteciffe.ac.nz</span>
        </div>
        <div class="detail-box">
          <i class="fas fa-home"></i>
          <span>67 Symonds st, Auckland City</span>
        </div>
      </div>

      <!-- bottom: contact-form-box-->
      <div class="contact-form-container">
        <h4>Contact us form</h4>
        <form action="">
          <input type="text" placeholder="Enter your name" />
          <input type="text" placeholder="Enter your email" />
          <input type="text" placeholder="Enter your subject" />
          <textarea
            name=""
            id=""
            cols="30"
            rows="5"
            placeholder="Message"
          ></textarea>
          <button class="submit-btn">Submit</button>
        </form>
      </div>
    </section>
    <!-- end of contact section -->

    <!-- google map -->
    <section class="map-box">
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6384.830308554377!2d174.76444659999999!3d-36.856480499999996!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6d0d47e66a134bf7%3A0xbb67e510f3594383!2s67%20Symonds%20Street%2C%20Grafton%2C%20Auckland%201010!5e0!3m2!1sen!2snz!4v1718537110903!5m2!1sen!2snz"
        width="600"
        height="450"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>
    </section>
    <!-- footer -->
    <footer>
      <div class="container footer-flex">
        <div>
          <h1>Whiteciffe</h1>
          <p>Copyright &copy; 2024</p>
        </div>
        <nav>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="course.html">Courses</a></li>
            <li><a href="Contact.html" style="color: #04aa6d">Contacts</a></li>
          </ul>
        </nav>
        <div class="social">
          <a href="#"><i class="fab fa-github fa-2x"></i></a>
          <a href="#"><i class="fab fa-facebook fa-2x"></i></a>
          <a href="#"><i class="fab fa-instagram fa-2x"></i></a>
          <a href="#"><i class="fab fa-twitter fa-2x"></i></a>
        </div>
      </div>
    </footer>
  </body>
</html>
